            plan: 2026-09-30-slice-1b1-sdk-gaps.md
            merge: a52fc1a
            finished: 2026-10-01
          - id: 1b.2
            title: Knowledge store and platform layer
            summary: The `.appstein/` store with its lock and freshness state, `sdk.json`, curated notes for Flutter 3.44–3.47, `toolchain.json` and `appstein sync`.
            status: done
            plan: 2026-10-01-slice-1b2-knowledge-store.md
            merge: 2cf55dd
            finished: 2026-10-01
          - id: 1b.3
            title: Project map (Dart code)
            summary: "The map of the user's Dart code through `official_mvvm`: features, symbols with doc-comment summaries, routes, layers and dependencies, from the resolved AST; `sync` runs `flutter pub get` when Flutter would."
            status: done
            plan: 2026-10-01-slice-1b3-project-map.md
            merge: 31fd665
            finished: 2026-10-01
