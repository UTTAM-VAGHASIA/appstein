name: CI

# Throwaway proof of ticket 15 (branch t15-proof, never merged): the
# Windows test job loses its runner on purpose 60 s into the unit tests,
# while the root tests still run. The triggers stay main's, since a root
# test reads them; neither push (main) nor pull_request fires on this
# branch, so it runs only by hand.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_STABLE: "3.47.5"
  GRAPHIFY_VERSION: "0.9.71"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_STABLE }}
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install graphify for the graph check's tests
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "graphifyy==$GRAPHIFY_VERSION"
          echo "APPSTEIN_GRAPHIFY_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
          echo "APPSTEIN_REQUIRE_GRAPHIFY=1" >> "$GITHUB_ENV"
      - run: dart pub get --enforce-lockfile
      - name: Unit tests
        shell: bash
        env:
          APPSTEIN_TRACE_TOKEN: ${{ github.token }}
        run: |
          ( sleep 60; taskkill //F //IM Runner.Listener.exe //IM Runner.Worker.exe ) > /dev/null 2>&1 &
          dart run tool/ci_unit_tests.dart \
            --job "test (${{ matrix.os }})" \
            --sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}" \
            --attempt ${{ github.run_attempt }} \
            --repo "${{ github.repository }}"

  lost-jobs:
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_STABLE }}
          channel: stable
          cache: true
      - run: dart pub get --enforce-lockfile
      - name: Find jobs lost with their runner
        shell: bash
        env:
          APPSTEIN_GITHUB_TOKEN: ${{ github.token }}
        run: >
          dart run tool/ci_lost_jobs.dart report
          --repo "${{ github.repository }}"
          --run ${{ github.run_id }}
          --attempt ${{ github.run_attempt }}
          --sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --server-url "${{ github.server_url }}"
