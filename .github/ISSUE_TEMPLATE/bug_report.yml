name: Bug report
description: Something in Appstein doesn't work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. For a security problem, don't use this form; see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. appstein sync
        2. …
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Appstein commit
      description: Appstein isn't released yet. Run `git rev-parse --short HEAD` in your Appstein clone.
    validations:
      required: true
  - type: input
    id: flutter
    attributes:
      label: Flutter version
      placeholder: "3.47.5"
  - type: textarea
    id: doctor
    attributes:
      label: Output of appstein doctor
      description: From your Appstein clone, `fvm dart run packages/appstein_cli/bin/appstein.dart doctor`.
      render: text
